<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fallbacks for crawlers that don't run JS. The live values come from content.js (meta). -->
<title>Lead Voice Core - Lyca Mobile | Kesavagokul R</title>
<meta name="description" content="Lead Voice Core at Lyca Mobile, an MVNO network spanning Europe. VoIP/IMS engineer experienced in SIP, SBCs, IP backbone networks, routing protocols and multi-layer troubleshooting.">
<link rel="stylesheet" href="styles.css">
</head>
<body id="top">

<div class="scroll-bar" id="scrollBar"></div>
<div id="root"></div>
<noscript><p style="padding:40px;text-align:center">This page needs JavaScript enabled.</p></noscript>

<!-- 1) The content (edit this file, not the HTML) -->
<script src="content.js"></script>

<!-- 2) The template: turns content.js into the page. Edit only to change layout/markup. -->
<script>
(function () {
  'use strict';
  var S = window.SITE;
  var root = document.getElementById('root');
  if (!S) { root.innerHTML = '<p style="padding:40px;text-align:center">content.js failed to load.</p>'; return; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function list(a) { return Array.isArray(a) ? a : []; }
  function each(a, fn) { return list(a).map(fn).join(''); }
  function dly(i, n) { return 'reveal-delay-' + ((i % n) + 1); }
  function bare(u) { return String(u).replace(/^https?:\/\/(www\.)?/i, ''); }
  function tel(p) { return 'tel:' + String(p).replace(/[^\d+]/g, ''); }
  function initials(n) {
    return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }
  function href(h, newTab) {
    var t = newTab === undefined ? /^https?:\/\//i.test(h) : newTab;
    return ' href="' + esc(h) + '"' + (t ? ' target="_blank" rel="noopener"' : '');
  }

  var P = S.person || {};
  var H = S.hero || {};
  var PR = S.projects || {};
  var C = S.contact || {};
  var DD = S.dropdown || {};

  function renderGithubDropdown(items) {
    if (!items || !items.length) return '';
    return '<div class="nav-item" id="githubDropdown">' +
      '<span class="dropdown-toggle">' + esc(DD.label || 'GitHub') + '</span>' +
      '<div class="dropdown-menu" id="githubMenu">' +
      each(items, function (repo) {
        var name = repo && repo.name ? repo.name : 'Repository';
        var url = repo && repo.project_url ? repo.project_url : (repo && repo.html_url ? repo.html_url : '#');
        var desc = repo && repo.description ? repo.description : '';
        return '<a href="' + esc(url) + '" target="_blank" rel="noopener" title="' + esc(desc) + '">' + esc(name) + '</a>';
      }) +
      '</div></div>';
  }

  function renderStaticDropdown(items) {
    if (!items || !items.length) return '';
    return '<div class="nav-item" id="githubDropdown"><span class="dropdown-toggle">' + esc(DD.label || 'Projects') + '</span>' +
      '<div class="dropdown-menu" id="githubMenu">' + each(items, function (p) {
        return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" title="' + esc(p.desc || '') + '">' + esc(p.name) + '</a>';
      }) + '</div></div>';
  }

  function loadGitHubRepos() {
    if (DD.source !== 'github' || !DD.username) return Promise.resolve([]);
    var base = 'https://api.github.com/users/' + encodeURIComponent(DD.username) + '/repos?sort=updated&per_page=100';
    function fetchPage(page, accumulated) {
      return fetch(base + '&page=' + page, {
        headers: { 'Accept': 'application/vnd.github+json' }
      }).then(function (response) {
        if (!response.ok) throw new Error('GitHub API request failed');
        return response.json();
      }).then(function (repos) {
        var all = accumulated.concat(repos || []);
        if (repos && repos.length === 100) return fetchPage(page + 1, all);
        return all;
      });
    }
    return fetchPage(1, [])
      .then(function (repos) {
        return (repos || []).sort(function (a, b) {
          return new Date(b.updated_at) - new Date(a.updated_at);
        }).map(function (repo) {
          return {
            name: repo.name,
            html_url: repo.html_url,
            homepage: repo.homepage || '',
            has_pages: !!repo.has_pages,
            project_url: repo.name === 'gokulkesavan.github.io' ? 'https://kesavagokul.com/' :
              (repo.homepage && /^https?:\/\//i.test(repo.homepage) ? repo.homepage :
                (repo.has_pages ? 'https://kesavagokul.com/go/?repo=' + encodeURIComponent(repo.name) : repo.html_url)),
            description: repo.description || ''
          };
        });
      })
      .catch(function () {
        return [];
      });
  }

  function describeGitHubProject(repo) {
    var descriptions = {
      pcap2sipp: 'Converts SIP PCAP/PCAPNG captures into a runnable SIPp UAC scenario directly in the browser. Turns a captured call flow into a repeatable SIP test without uploading the trace.',
      amr_player: 'Analyzes AMR and AMR-WB RTP streams and reconstructs audio for browser playback. Helps inspect codec modes, alignment and media behavior during VoIP trace troubleshooting.',
      evs_player: 'Analyzes EVS RTP streams in PCAP/PCAPNG, reconstructs codec frames and decodes them to WAV using WebAssembly. Supports stream playback and mixing decoded streams into a conversation.',
      txt2pcap_ss7: 'Converts Huawei UGC/MSOFTX text hexdumps into Wireshark-readable PCAP files. Reconstructs packet data for SIP and SS7 signalling analysis.',
      trace_compare: 'Compares SIP traces using header- and parameter-aware differences instead of raw line matching. Highlights meaningful SIP/SDP changes while ignoring generated identifiers and formatting noise.',
      sizing_bw: 'Calculates VoIP bandwidth from codec, packetization, transport and network-overhead assumptions. Helps compare per-direction capacity requirements across network and security options.'
    };
    if (descriptions[repo.name]) return descriptions[repo.name];
    if (repo.description) return repo.description.replace(/[.\\s]+$/, '') +
      '. Open the repository or its live deployment to explore the implementation and workflow.';
    return 'A telecom engineering project maintained in this GitHub account. Open the repository to review its implementation, usage and development history.';
  }

  function githubProjectsBody(items) {
    var projects = list(items).filter(function (repo) { return repo.name !== 'gokulkesavan.github.io'; });
    var target = document.getElementById('githubProjectsGrid');
    if (!target) return;
    target.innerHTML = each(projects, function (repo, i) {
      var live = repo.project_url || repo.html_url;
      var text = describeGitHubProject(repo);
      return '<article class="card project github-project reveal ' + dly(i, 3) + '">' +
        '<h3>' + esc(repo.name.replace(/[-_]/g, ' ')) + '</h3>' +
        '<p>' + esc(text) + '</p>' +
        '<div class="project-links">' +
        '<a class="btn btn-small btn-primary" href="' + esc(live) + '" target="_blank" rel="noopener">' +
          (repo.has_pages || repo.homepage ? 'Open live project' : 'Open repository') + '</a>' +
        '<a class="project-source" href="' + esc(repo.html_url) + '" target="_blank" rel="noopener">Source code ↗</a>' +
        '</div></article>';
    });
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !('IntersectionObserver' in window)) {
      target.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in-view'); });
    } else {
      target.querySelectorAll('.reveal').forEach(function (el) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add('in-view'); observer.disconnect(); }
          });
        }, { threshold: 0.12 });
        observer.observe(el);
      });
    }
  }

  function aboutBody() {
    if (!list(S.summary).length) return '';
    return '<h2 class="section-title reveal">Summary</h2>' +
      '<div class="prose reveal reveal-delay-1">' +
      each(S.summary, function (p) { return '<p>' + rich(p) + '</p>'; }) + '</div>';
  }

  function skillsBody() {
    if (!list(S.skills).length) return '';
    return '<h2 class="section-title reveal">Skills</h2><div class="grid grid-3">' +
      each(S.skills, function (g, i) {
        return '<article class="card reveal ' + dly(i, 3) + '"><h3>' + esc(g.title) + '</h3>' +
          '<ul class="tags">' + each(g.items, function (x) { return '<li>' + esc(x) + '</li>'; }) + '</ul>' +
          (g.note ? '<p class="card-note">' + esc(g.note) + '</p>' : '') + '</article>';
      }) + '</div>';
  }

  function projectsBody() {
    var items = list(PR.items), os = list(PR.opensource);
    if (!items.length && !os.length) return '';
    return '<h2 class="section-title reveal">Key Projects</h2>' +
      (PR.lead ? '<p class="section-lead reveal reveal-delay-1">' + rich(PR.lead) + '</p>' : '') +
      (items.length ? '<div class="grid grid-3">' + each(items, function (p, i) {
        return '<article class="card project reveal ' + dly(i, 3) + '">' +
          (p.date ? '<p class="project-date">' + esc(p.date) + '</p>' : '') +
          '<h3>' + esc(p.title) + '</h3><p>' + rich(p.text) + '</p></article>';
      }) + '</div>' : '') +
      (os.length ? '<h3 class="subsection-title reveal">Open-Source Contributions</h3><div class="grid grid-2">' +
        each(os, function (p, i) {
          var b = p.button || {};
          return '<article class="card project project-link reveal ' + dly(i, 2) + '">' +
            '<h3>' + esc(p.title) + '</h3><p>' + rich(p.text) + '</p>' +
            (b.href ? '<p class="card-actions"><a class="btn btn-small' + (b.primary ? ' btn-primary' : '') + '"' +
              href(b.href, b.newTab) + '>' + esc(b.label || 'Open') + '</a></p>' : '') +
            '</article>';
        }) + '</div>' : '');
  }

  function experienceBody() {
    if (!list(S.experience).length) return '';
    return '<h2 class="section-title reveal">Experience</h2><ol class="timeline" id="timeline">' +
      each(S.experience, function (j) {
        return '<li class="timeline-item reveal"><div class="timeline-head">' +
          '<h3>' + esc(j.role) + '</h3><p class="company">' + esc(j.company) + '</p>' +
          '<p class="period">' + esc(j.period) + '</p></div>' +
          '<ul class="bullets">' + each(j.bullets, function (b) { return '<li>' + rich(b) + '</li>'; }) + '</ul></li>';
      }) + '</ol>';
  }

  function credentialsBody() {
    var certs = list(S.certifications), edu = list(S.education),
        langs = list(S.languages), ints = list(S.interests);
    if (!certs.length && !edu.length && !langs.length && !ints.length) return '';
    var html = '';
    if (certs.length) {
      html += '<h2 class="section-title reveal">Certifications</h2><div class="grid grid-3">' +
        each(certs, function (c, i) {
          return '<article class="card cert reveal ' + dly(i, 3) + '">' +
            '<div class="cert-brand"><span class="cert-wordmark cert-wordmark-' + (i + 1) + '">' + esc(c.issuer || c.title) + '</span></div>' +
            '<h3>' + esc(c.title) + '</h3>' +
            (c.issuer ? '<p class="company">' + esc(c.issuer) + '</p>' : '') +
            (c.date ? '<p class="period">' + esc(c.date) + '</p>' : '') +
            (c.certificateUrl ? '<p class="card-actions"><a class="btn btn-small btn-outline" href="' + esc(c.certificateUrl) + '" target="_blank" rel="noopener">View certificate PDF ↗</a></p>' : '') +
            '</article>';
        }) + '</div>';
    }
    if (certs.length) {
      html += '<div id="github-projects" class="github-projects-block">' +
        '<h2 class="section-title reveal">GitHub Projects</h2>' +
        '<p class="section-lead reveal reveal-delay-1">Selected telecom tools and trace-analysis projects. Each card includes a short description, live project link when available, and source code.</p>' +
        '<div class="grid grid-3" id="githubProjectsGrid"></div></div>';
    }
    if (edu.length) {
      html += '<h2 class="section-title' + (certs.length ? ' section-title-spaced' : '') + ' reveal">Education</h2>' +
        '<div class="grid">' + each(edu, function (e) {
          return '<div class="card edu reveal reveal-delay-1"><h3>' + esc(e.degree) + '</h3>' +
            (e.school ? '<p class="company">' + esc(e.school) + '</p>' : '') +
            (e.period ? '<p class="period">' + esc(e.period) + '</p>' : '') + '</div>';
        }) + '</div>';
    }
    if (langs.length || ints.length) {
      html += '<div class="grid grid-2 grid-spaced">' +
        (langs.length ? '<div class="card reveal reveal-delay-1"><h3>Languages</h3><ul class="plain-list">' +
          each(langs, function (l) { return '<li><span>' + esc(l.level) + '</span>' + esc(l.name) + '</li>'; }) +
          '</ul></div>' : '') +
        (ints.length ? '<div class="card reveal reveal-delay-2"><h3>Interests</h3><ul class="plain-list">' +
          each(ints, function (x) { return '<li>' + esc(x) + '</li>'; }) + '</ul></div>' : '') +
        '</div>';
    }
    return html;
  }

  function contactBody() {
    var cards = [];
    if (P.email)    cards.push(['Email', P.email, 'mailto:' + P.email]);
    if (P.phone)    cards.push(['Phone', P.phone, tel(P.phone)]);
    if (P.linkedin) cards.push(['LinkedIn', bare(P.linkedin), P.linkedin]);
    if (P.github)   cards.push(['GitHub', bare(P.github), P.github]);
    list(C.extra).forEach(function (x) { cards.push([x.label, x.value, x.href]); });
    return '<h2 class="section-title reveal">Get in touch</h2>' +
      (C.lead ? '<p class="section-lead reveal reveal-delay-1">' + rich(C.lead) + '</p>' : '') +
      '<div class="contact-grid">' + each(cards, function (c, i) {
        return '<a class="contact-card reveal ' + dly(i, 4) + '"' + href(c[2]) + '>' +
          '<span class="contact-label">' + esc(c[0]) + '</span><span class="contact-value">' + esc(c[1]) + '</span></a>';
      }) + '</div>' +
      (C.cta ? '<div class="cta-section reveal reveal-delay-1"><p>' + esc(C.cta) + '</p></div>' : '');
  }

  var sections = [
    { id: 'about', nav: 'About', body: aboutBody() },
    { id: 'skills', nav: 'Skills', body: skillsBody() },
    { id: 'projects', nav: 'Projects', body: projectsBody() },
    { id: 'experience', nav: 'Experience', body: experienceBody() },
    { id: 'credentials', nav: 'Credentials', body: credentialsBody() },
    { id: 'contact', nav: 'Contact', body: contactBody() }
  ].filter(function (s) { return s.body; });

  function header(githubItems) {
    var mark = P.photo ? '<img src="' + esc(P.photo) + '" alt="' + esc(P.name) + '">' : esc(initials(P.name));
    var links = sections.filter(function (s) { return s.id !== 'contact'; })
      .map(function (s) { return '<a href="#' + s.id + '">' + s.nav + '</a>'; }).join('') +
      (githubItems && githubItems.length ? '<a href="#github-projects">GitHub</a>' : '');

    var dd = DD.source === 'github'
      ? renderGithubDropdown(githubItems)
      : renderStaticDropdown(list(DD.items));

    var hasContact = sections.some(function (s) { return s.id === 'contact'; });
    return '<header class="site-header" id="siteHeader"><div class="wrap header-inner">' +
      '<a class="brand" href="#top"><span class="brand-mark">' + mark + '</span><span>' + esc(P.name) + '</span></a>' +
      '<nav class="nav" id="nav">' + links + dd + (hasContact ? '<a href="#contact">Contact</a>' : '') + '</nav></div></header>';
  }

  function hero() {
    var actions = '';
    var meta = '';
    if (P.locationFull) meta += '<li><span>Location</span>' + esc(P.locationFull) + '</li>';
    return '<section class="hero"><div class="wrap hero-inner">' +
      (H.eyebrow ? '<p class="eyebrow"><span class="dot"></span>' + esc(H.eyebrow) + '</p>' : '') +
      '<h1>' + (H.title && H.title.indexOf('Works @ ') === 0 ? '<span class="hero-title-prefix">Works</span>' + esc(H.title.slice(6)) : esc(H.title || P.name)) + '</h1>' +
      (H.tagline ? '<p class="tagline">' + rich(H.tagline) + '</p>' : '') +
      (H.summary ? '<p class="hero-summary">' + rich(H.summary) + '</p>' : '') +
      '<div class="hero-actions">' + actions + '</div>' +
      '<ul class="hero-meta">' + meta + '</ul></div></section>';
  }

  function footer() {
    return '<footer class="site-footer"><div class="wrap footer-inner">' +
      '<p>© <span id="year">' + new Date().getFullYear() + '</span> ' + esc(P.name) +
      (P.location ? ' · ' + esc(P.location) : '') + '</p>' +
      '<p><a href="#top">Back to top ↑</a></p></div></footer>';
  }

  loadGitHubRepos().then(function (githubItems) {
    root.innerHTML = header(githubItems) + '<main>' + hero() +
      sections.map(function (s, i) {
        return '<section id="' + s.id + '" class="section' + (i % 2 ? ' section-alt' : '') + '">' +
          '<div class="wrap">' + s.body + '</div></section>';
      }).join('') + '</main>' + footer();

    githubProjectsBody(githubItems);

    if (S.meta && S.meta.title) document.title = S.meta.title;
    if (S.meta && S.meta.description) {
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', S.meta.description);
    }

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var bar = document.getElementById('scrollBar');
    var headerEl = document.getElementById('siteHeader');
    var ticking = false;

    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var h = document.documentElement;
        var max = h.scrollHeight - h.clientHeight;
        var top = h.scrollTop || document.body.scrollTop;
        if (bar) bar.style.width = ((max > 0 ? top / max : 0) * 100) + '%';
        if (headerEl) headerEl.classList.toggle('scrolled', top > 8);
        ticking = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    var revealEls = document.querySelectorAll('.reveal');
    var timeline = document.getElementById('timeline');
    if (reduce || !('IntersectionObserver' in window)) {
      revealEls.forEach(function (el) { el.classList.add('in-view'); });
      if (timeline) timeline.classList.add('in-view');
    } else {
      var revealObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { entry.target.classList.add('in-view'); revealObs.unobserve(entry.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      revealEls.forEach(function (el) { revealObs.observe(el); });

      if (timeline) {
        var tlObs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { timeline.classList.add('in-view'); tlObs.disconnect(); }
          });
        }, { threshold: 0.05 });
        tlObs.observe(timeline);
      }
    }

    var navLinks = Array.prototype.slice.call(document.querySelectorAll('#nav a'))
      .filter(function (a) { return (a.getAttribute('href') || '').charAt(0) === '#'; });
    var navSections = navLinks.map(function (a) { return document.querySelector(a.getAttribute('href')); }).filter(Boolean);
    if ('IntersectionObserver' in window && navSections.length) {
      var navObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var id = '#' + entry.target.id;
          navLinks.forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === id); });
        });
      }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
      navSections.forEach(function (s) { navObs.observe(s); });
    }

    var dd = document.getElementById('githubDropdown');
    if (dd) {
      var toggle = dd.querySelector('.dropdown-toggle');
      if (toggle) {
        toggle.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); dd.classList.toggle('active'); });
      }
      document.addEventListener('click', function (e) { if (!dd.contains(e.target)) dd.classList.remove('active'); });
      var githubMenu = document.getElementById('githubMenu');
      if (githubMenu) {
        githubMenu.addEventListener('click', function () { dd.classList.remove('active'); });
      }
    }
  });
})();
</script>
</body>
</html>
